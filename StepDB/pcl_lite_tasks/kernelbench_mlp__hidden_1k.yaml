test_name: kernelbench_mlp__hidden_1k
# Derived from StepDB seed_kernels/kernelbench/level3/mlp (preset: hidden_1k).
# Ported from KernelBench level3/1_MLP.py: a 3-layer MLP with ReLU between
# the first two linears. Preset values: B=32, D_in=1024, D_h1=1024, D_h2=1024,
# D_out=512.
# The StepDB reference uses nn.Linear (Kaiming init for W, uniform for b);
# this PCL-lite spec substitutes torch.randn for every weight/bias so the
# kernel is fully self-contained. The math (relu(x @ W.T + b)) is identical
# in structure to the StepDB reference.py:Model.forward — biases are stored
# as (1, D) so they are >=2-D and loadable by StepDB's offchip_load.
dims:
  B: 32
  D_in: 1024
  D_h1: 1024
  D_h2: 1024
  D_out: 512

inputs:
  - name: x
    dtype: fp32
    dims: [D_in, B]
    data_gen: torch.randn
  # Weight dims are listed innermost-first so the torch shape (the reverse)
  # is (in, out) — i.e. ``x @ W`` is a plain (B, in) @ (in, out) matmul. The
  # StepDB reference uses nn.Linear's (out, in) layout with ``x @ W.T``;
  # both are mathematically equivalent on random init, and (in, out) keeps
  # the data_transform free of explicit transposes.
  - name: w1
    dtype: fp32
    dims: [D_h1, D_in]
    data_gen: torch.randn
  - name: b1
    dtype: fp32
    dims: [D_h1, 1]
    data_gen: torch.randn
  - name: w2
    dtype: fp32
    dims: [D_h2, D_h1]
    data_gen: torch.randn
  - name: b2
    dtype: fp32
    dims: [D_h2, 1]
    data_gen: torch.randn
  - name: w3
    dtype: fp32
    dims: [D_out, D_h2]
    data_gen: torch.randn
  - name: b3
    dtype: fp32
    dims: [D_out, 1]
    data_gen: torch.randn

outputs:
  - name: S0
    dtype: fp32
    dims: [D_out, B]
    data_transform:
      - |
        h1 = torch.relu(input_data['x'] @ input_data['w1'] + input_data['b1'])
        h2 = torch.relu(h1 @ input_data['w2'] + input_data['b2'])
        h2 @ input_data['w3'] + input_data['b3']
