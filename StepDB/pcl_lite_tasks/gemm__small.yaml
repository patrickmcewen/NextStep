test_name: gemm__small
# Derived from StepDB seed_kernels/matmul/gemm (preset: small).
# Preset values come from StepDB/bench_config.yaml; gold from
# seed_kernels/matmul/gemm/reference.py:compute_gold.
dims:
  M: 32
  K: 48
  N: 64

inputs:
  - name: A
    dtype: fp32
    dims: [K, M]
    data_gen: torch.randn
  - name: B
    dtype: fp32
    dims: [N, K]
    data_gen: torch.randn

outputs:
  - name: S0
    dtype: fp32
    dims: [N, M]
    data_transform:
      - |
        torch.matmul(input_data['A'], input_data['B'])
