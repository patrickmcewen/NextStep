<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical: matmul_binarymap/wide_tile (5314 cycles)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; overflow: hidden; }
        h1 { margin-top: 0; }
        #container { width: 100%; height: calc(100vh - 120px); overflow: auto; position: relative; }
        #timeline { position: relative; margin-top: 40px; }
        .file-row { height: 50px; margin-bottom: 5px; position: relative; border-bottom: 1px solid #eee; }
        .file-label { position: absolute; left: 0; top: 10px; width: 300px; font-weight: bold;
                       text-align: right; padding-right: 10px; overflow: visible; word-wrap: break-word; line-height: 1.2; }
        .timeline-container { margin-left: 320px; position: relative; height: 100%; }
        .block { position: absolute; height: 30px; top: 10px; border-radius: 3px; text-align: center;
                  font-size: 10px; overflow: hidden; white-space: nowrap; color: white; display: flex;
                  align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.2s; }
        .block:hover { opacity: 0.8; }
        .event-normal { background-color: #33A8FF; }
        .event-stop { background-color: #FF5733; }
        .timeline-marker { position: absolute; width: 1px; height: 100%; background-color: rgba(0,0,0,0.1); top: 0; }
        .timeline-label { position: absolute; font-size: 10px; color: #666; top: -20px; transform: translateX(-50%); }
        .controls { margin-bottom: 20px; }
        .tooltip { position: absolute; background-color: rgba(0,0,0,0.8); color: white; padding: 8px;
                    border-radius: 4px; font-size: 12px; z-index: 100; pointer-events: none; display: none; }
        button { margin-right: 10px; padding: 5px 10px; cursor: pointer; }
        #scale-slider { width: 200px; display: inline-block; vertical-align: middle; }
        .legend { margin-top: 10px; display: flex; align-items: center; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; margin-right: 20px; margin-bottom: 5px; }
        .legend-color { width: 15px; height: 15px; border-radius: 3px; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Analytical: matmul_binarymap/wide_tile (5314 cycles)</h1>
    <div class="controls">
        <button id="zoom-in">Zoom In</button>
        <button id="zoom-out">Zoom Out</button>
        <button id="reset">Reset</button>
        <label for="scale-slider">Scale: </label>
        <input type="range" id="scale-slider" min="1" max="100" value="10">
        <span id="scale-value">1x</span>
    </div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color event-normal"></div><span>Normal Event</span></div>
        <div class="legend-item"><div class="legend-color event-stop"></div><span>Stop Event</span></div>
    </div>
    <div id="container"><div id="timeline"></div></div>
    <div id="tooltip" class="tooltip"></div>
    <script>
        const data = [{"file_id": "LinearOffChipLoad_83", "name": "LinearOffChipLoad", "id": "83", "prefix": "event", "identifier": "event_LinearOffChipLoad_83_1", "start": 0.0, "end": 75.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_83", "name": "LinearOffChipLoad", "id": "83", "prefix": "event", "identifier": "event_LinearOffChipLoad_83_2", "start": 75.0, "end": 150.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_83", "name": "LinearOffChipLoad", "id": "83", "prefix": "event", "identifier": "event_LinearOffChipLoad_83_3", "start": 150.0, "end": 225.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_83", "name": "LinearOffChipLoad", "id": "83", "prefix": "event", "identifier": "event_LinearOffChipLoad_83_4", "start": 225.0, "end": 300.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_1", "start": 75.0, "end": 75.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_2", "start": 149.0, "end": 150.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_3", "start": 224.0, "end": 225.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_4", "start": 299.0, "end": 300.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_5", "start": 374.0, "end": 375.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_6", "start": 449.0, "end": 450.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_7", "start": 524.0, "end": 525.0, "is_stop": false}, {"file_id": "RepeatStatic_84", "name": "RepeatStatic", "id": "84", "prefix": "event", "identifier": "event_RepeatStatic_84_8", "start": 599.0, "end": 600.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_1", "start": 0.0, "end": 167.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_2", "start": 167.0, "end": 334.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_3", "start": 334.0, "end": 501.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_4", "start": 501.0, "end": 668.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_5", "start": 668.0, "end": 835.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_6", "start": 835.0, "end": 1002.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_7", "start": 1002.0, "end": 1169.0, "is_stop": false}, {"file_id": "LinearOffChipLoad_85", "name": "LinearOffChipLoad", "id": "85", "prefix": "event", "identifier": "event_LinearOffChipLoad_85_8", "start": 1169.0, "end": 1336.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_1", "start": 167.0, "end": 807.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_2", "start": 807.0, "end": 1447.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_3", "start": 1447.0, "end": 2087.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_4", "start": 2087.0, "end": 2727.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_5", "start": 2727.0, "end": 3367.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_6", "start": 3367.0, "end": 4007.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_7", "start": 4007.0, "end": 4647.0, "is_stop": false}, {"file_id": "BinaryMap_86", "name": "BinaryMap", "id": "86", "prefix": "event", "identifier": "event_BinaryMap_86_8", "start": 4647.0, "end": 5287.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_1", "start": 807.0, "end": 834.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_2", "start": 834.0, "end": 1474.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_3", "start": 1474.0, "end": 2114.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_4", "start": 2114.0, "end": 2754.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_5", "start": 2754.0, "end": 3394.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_6", "start": 3394.0, "end": 4034.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_7", "start": 4034.0, "end": 4674.0, "is_stop": false}, {"file_id": "OffChipStore_87", "name": "OffChipStore", "id": "87", "prefix": "event", "identifier": "event_OffChipStore_87_8", "start": 4674.0, "end": 5314.0, "is_stop": false}];
        const nameIdList = ["LinearOffChipLoad_83", "RepeatStatic_84", "LinearOffChipLoad_85", "BinaryMap_86", "OffChipStore_87"];
        const minTime = 0.0;
        const maxTime = 5314.0;
        let scale = 0.5;
        let timelineEl = document.getElementById('timeline');
        let containerEl = document.getElementById('container');
        let tooltipEl = document.getElementById('tooltip');
        let scaleSlider = document.getElementById('scale-slider');
        let scaleValue = document.getElementById('scale-value');

        function renderTimeline() {
            timelineEl.innerHTML = '';
            const timelineWidth = (maxTime - minTime) * scale;
            nameIdList.forEach(nameId => {
                const fileRow = document.createElement('div');
                fileRow.className = 'file-row';
                const fileLabel = document.createElement('div');
                fileLabel.className = 'file-label';
                fileLabel.textContent = nameId;
                fileLabel.title = nameId;
                const tc = document.createElement('div');
                tc.className = 'timeline-container';
                tc.style.width = `${timelineWidth}px`;
                fileRow.appendChild(fileLabel);
                fileRow.appendChild(tc);
                timelineEl.appendChild(fileRow);
                const items = data.filter(item => item.file_id === nameId);
                items.forEach(item => {
                    const block = document.createElement('div');
                    block.className = item.is_stop ? 'block event-stop' : 'block event-normal';
                    const left = (item.start - minTime) * scale;
                    const width = (item.end - item.start) * scale;
                    block.style.left = `${left}px`;
                    block.style.width = `${Math.max(width, 1)}px`;
                    if (width > 40) block.textContent = item.identifier;
                    block.dataset.identifier = item.identifier;
                    block.dataset.name = item.name;
                    block.dataset.id = item.id;
                    block.dataset.start = item.start;
                    block.dataset.end = item.end;
                    block.dataset.isStop = item.is_stop;
                    block.addEventListener('mouseover', showTooltip);
                    block.addEventListener('mousemove', moveTooltip);
                    block.addEventListener('mouseout', hideTooltip);
                    tc.appendChild(block);
                });
            });
            const stepSize = calculateStepSize(maxTime - minTime);
            for (let t = minTime; t <= maxTime; t += stepSize) {
                const marker = document.createElement('div');
                marker.className = 'timeline-marker';
                marker.style.left = `${(t - minTime) * scale + 320}px`;
                const label = document.createElement('div');
                label.className = 'timeline-label';
                label.textContent = t.toFixed(0) + ' cyc';
                marker.appendChild(label);
                timelineEl.appendChild(marker);
            }
        }

        function calculateStepSize(range) {
            const roughStep = range / 10;
            const mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
            const norm = roughStep / mag;
            if (norm < 1.5) return mag;
            if (norm < 3.5) return 2 * mag;
            if (norm < 7.5) return 5 * mag;
            return 10 * mag;
        }

        function showTooltip(e) {
            const b = e.target;
            tooltipEl.innerHTML = `
                Name: ${b.dataset.name}<br>
                ID: ${b.dataset.id}<br>
                Start: ${parseFloat(b.dataset.start).toFixed(0)} cyc<br>
                End: ${parseFloat(b.dataset.end).toFixed(0)} cyc<br>
                Duration: ${(parseFloat(b.dataset.end) - parseFloat(b.dataset.start)).toFixed(0)} cyc<br>
                Type: ${b.dataset.isStop === 'true' ? 'Stop' : 'Normal'}
            `;
            tooltipEl.style.display = 'block';
            moveTooltip(e);
        }
        function moveTooltip(e) { tooltipEl.style.left = `${e.pageX + 10}px`; tooltipEl.style.top = `${e.pageY + 10}px`; }
        function hideTooltip() { tooltipEl.style.display = 'none'; }

        document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.5; updateScale(); renderTimeline(); });
        document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.5; updateScale(); renderTimeline(); });
        document.getElementById('reset').addEventListener('click', () => { scale = 0.5; updateScale(); renderTimeline(); containerEl.scrollLeft = 0; });
        scaleSlider.addEventListener('input', () => { scale = scaleSlider.value / 10; updateScale(); renderTimeline(); });
        function updateScale() { scaleValue.textContent = `${scale.toFixed(2)}x`; scaleSlider.value = Math.round(scale * 10); }

        updateScale();
        renderTimeline();
    </script>
</body>
</html>
