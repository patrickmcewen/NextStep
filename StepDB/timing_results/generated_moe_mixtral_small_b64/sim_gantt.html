, {"file_id": "UnaryMap_96", "name": "UnaryMap", "id": "96", "prefix": "event", "identifier": "event_UnaryMap_96_2", "start": 5949.0, "end": 5950.0, "is_stop": false}, {"file_id": "UnaryMap_96", "name": "UnaryMap", "id": "96", "prefix": "event", "identifier": "event_UnaryMap_96_3", "start": 9023.0, "end": 9024.0, "is_stop": false}, {"file_id": "BinaryMap_97", "name": "BinaryMap", "id": "97", "prefix": "event", "identifier": "event_BinaryMap_97_1", "start": 3531.0, "end": 3532.0, "is_stop": false}, {"file_id": "BinaryMap_97", "name": "BinaryMap", "id": "97", "prefix": "event", "identifier": "event_BinaryMap_97_2", "start": 5951.0, "end": 5952.0, "is_stop": false}, {"file_id": "LinearOffChipLoadRef_98", "name": "LinearOffChipLoadRef", "id": "98", "prefix": "event", "identifier": "event_LinearOffChipLoadRef_98_1", "start": 43.0, "end": 1482.0, "is_stop": false}, {"file_id": "LinearOffChipLoadRef_98", "name": "LinearOffChipLoadRef", "id": "98", "prefix": "event", "identifier": "event_LinearOffChipLoadRef_98_2", "start": 1482.0, "end": 3901.0, "is_stop": false}, {"file_id": "LinearOffChipLoadRef_98", "name": "LinearOffChipLoadRef", "id": "98", "prefix": "event", "identifier": "event_LinearOffChipLoadRef_98_3", "start": 3901.0, "end": 6975.0, "is_stop": false}, {"file_id": "BinaryMap_99", "name": "BinaryMap", "id": "99", "prefix": "event", "identifier": "event_BinaryMap_99_1", "start": 3533.0, "end": 5581.0, "is_stop": false}];
        const nameIdList = ["LinearOffChipLoad_0", "LinearOffChipLoad_1", "FlatPartition_4", "FlatPartition_5", "LinearOffChipLoadRef_8", "LinearOffChipLoadRef_9", "BinaryMap_10", "BinaryMap_11", "UnaryMap_12", "BinaryMap_13", "LinearOffChipLoadRef_14", "BinaryMap_15", "LinearOffChipLoadRef_20", "LinearOffChipLoadRef_21", "BinaryMap_22", "BinaryMap_23", "UnaryMap_24", "BinaryMap_25", "LinearOffChipLoadRef_26", "BinaryMap_27", "LinearOffChipLoadRef_32", "LinearOffChipLoadRef_33", "BinaryMap_34", "BinaryMap_35", "UnaryMap_36", "BinaryMap_37", "LinearOffChipLoadRef_38", "BinaryMap_39", "LinearOffChipLoadRef_44", "LinearOffChipLoadRef_45", "BinaryMap_46", "BinaryMap_47", "UnaryMap_48", "BinaryMap_49", "LinearOffChipLoadRef_50", "BinaryMap_51", "LinearOffChipLoadRef_56", "LinearOffChipLoadRef_57", "BinaryMap_58", "BinaryMap_59", "UnaryMap_60", "BinaryMap_61", "LinearOffChipLoadRef_62", "BinaryMap_63", "LinearOffChipLoadRef_68", "LinearOffChipLoadRef_69", "BinaryMap_70", "BinaryMap_71", "UnaryMap_72", "BinaryMap_73", "LinearOffChipLoadRef_74", "BinaryMap_75", "LinearOffChipLoadRef_80", "LinearOffChipLoadRef_81", "BinaryMap_82", "BinaryMap_83", "UnaryMap_84", "BinaryMap_85", "LinearOffChipLoadRef_86", "BinaryMap_87", "LinearOffChipLoadRef_92", "LinearOffChipLoadRef_93", "BinaryMap_94", "BinaryMap_95", "UnaryMap_96", "BinaryMap_97", "LinearOffChipLoadRef_98", "BinaryMap_99"];
        const minTime = 0.0;
        const maxTime = 14415.0;
        let scale = 0.5;
        let timelineEl = document.getElementById('timeline');
        let containerEl = document.getElementById('container');
        let tooltipEl = document.getElementById('tooltip');
        let scaleSlider = document.getElementById('scale-slider');
        let scaleValue = document.getElementById('scale-value');

        function renderTimeline() {
            timelineEl.innerHTML = '';
            const timelineWidth = (maxTime - minTime) * scale;
            nameIdList.forEach(nameId => {
                const fileRow = document.createElement('div');
                fileRow.className = 'file-row';
                const fileLabel = document.createElement('div');
                fileLabel.className = 'file-label';
                fileLabel.textContent = nameId;
                fileLabel.title = nameId;
                const tc = document.createElement('div');
                tc.className = 'timeline-container';
                tc.style.width = `${timelineWidth}px`;
                fileRow.appendChild(fileLabel);
                fileRow.appendChild(tc);
                timelineEl.appendChild(fileRow);
                const items = data.filter(item => item.file_id === nameId);
                items.forEach(item => {
                    const block = document.createElement('div');
                    block.className = item.is_stop ? 'block event-stop' : 'block event-normal';
                    const left = (item.start - minTime) * scale;
                    const width = (item.end - item.start) * scale;
                    block.style.left = `${left}px`;
                    block.style.width = `${Math.max(width, 1)}px`;
                    if (width > 40) block.textContent = item.identifier;
                    block.dataset.identifier = item.identifier;
                    block.dataset.name = item.name;
                    block.dataset.id = item.id;
                    block.dataset.start = item.start;
                    block.dataset.end = item.end;
                    block.dataset.isStop = item.is_stop;
                    block.addEventListener('mouseover', showTooltip);
                    block.addEventListener('mousemove', moveTooltip);
                    block.addEventListener('mouseout', hideTooltip);
                    tc.appendChild(block);
                });
            });
            const stepSize = calculateStepSize(maxTime - minTime);
            for (let t = minTime; t <= maxTime; t += stepSize) {
                const marker = document.createElement('div');
                marker.className = 'timeline-marker';
                marker.style.left = `${(t - minTime) * scale + 320}px`;
                const label = document.createElement('div');
                label.className = 'timeline-label';
                label.textContent = t.toFixed(0) + ' cyc';
                marker.appendChild(label);
                timelineEl.appendChild(marker);
            }
        }

        function calculateStepSize(range) {
            const roughStep = range / 10;
            const mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
            const norm = roughStep / mag;
            if (norm < 1.5) return mag;
            if (norm < 3.5) return 2 * mag;
            if (norm < 7.5) return 5 * mag;
            return 10 * mag;
        }

        function showTooltip(e) {
            const b = e.target;
            tooltipEl.innerHTML = `
                Name: ${b.dataset.name}<br>
                ID: ${b.dataset.id}<br>
                Start: ${parseFloat(b.dataset.start).toFixed(0)} cyc<br>
                End: ${parseFloat(b.dataset.end).toFixed(0)} cyc<br>
                Duration: ${(parseFloat(b.dataset.end) - parseFloat(b.dataset.start)).toFixed(0)} cyc<br>
                Type: ${b.dataset.isStop === 'true' ? 'Stop' : 'Normal'}
            `;
            tooltipEl.style.display = 'block';
            moveTooltip(e);
        }
        function moveTooltip(e) { tooltipEl.style.left = `${e.pageX + 10}px`; tooltipEl.style.top = `${e.pageY + 10}px`; }
        function hideTooltip() { tooltipEl.style.display = 'none'; }

        document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.5; updateScale(); renderTimeline(); });
        document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.5; updateScale(); renderTimeline(); });
        document.getElementById('reset').addEventListener('click', () => { scale = 0.5; updateScale(); renderTimeline(); containerEl.scrollLeft = 0; });
        scaleSlider.addEventListener('input', () => { scale = scaleSlider.value / 10; updateScale(); renderTimeline(); });
        function updateScale() { scaleValue.textContent = `${scale.toFixed(2)}x`; scaleSlider.value = Math.round(scale * 10); }

        updateScale();
        renderTimeline();
    </script>
